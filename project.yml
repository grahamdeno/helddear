# Held Dear. `xcodegen generate` makes HeldDear.xcodeproj (not checked in).
name: HeldDear
options:
  bundleIdPrefix: com.grahamdeno
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7MHDTK68M2
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HeldDear:
    type: application
    platform: iOS
    sources:
      - App/HeldDear
      - App/Shared
    dependencies:
      - target: HeldDearShare
      - target: HeldDearWidgets
    settings:
      base:
        PRODUCT_NAME: HeldDear
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.helddear
        CODE_SIGN_ENTITLEMENTS: Config/HeldDear.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Held Dear
        INFOPLIST_KEY_NSContactsUsageDescription: "Held Dear looks for birthdays, phone numbers and addresses already in your contacts, and adds a birthday to a contact only when you tap Add to Contacts. Nothing leaves your iPhone."
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Held Dear adds a dinner date you choose to your calendar. It never reads your calendar."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Held Dear turns what you say into text on this iPhone, so you can add a birthday or a wish by voice."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Held Dear finds photos from past birthdays in your library, on this iPhone, so you can see the years and use one on a card."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Held Dear listens only after you tap the microphone button, to add a birthday or a wish by voice."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      # The CloudKit environment, for the entitlement and for Info.plist (HeldDearCloudKitEnvironment): Debug builds
      # use Development, Release builds (TestFlight and the App Store) use Production.
      configs:
        Debug:
          HELDDEAR_CLOUDKIT_ENVIRONMENT: Development
        Release:
          HELDDEAR_CLOUDKIT_ENVIRONMENT: Production
  HeldDearSchemaTest:
    # The Schema Test app (Nov 23, 2026): the same app sources with no widget or share extension, its own bundle ID,
    # container and group, and the compile flag SCHEMA_TEST. It opens on one screen that uploads one of every record
    # type to the test container. It is never part of the real app. See Config/HeldDearSchemaTest.entitlements.
    type: application
    platform: iOS
    sources:
      - App/HeldDear
      - App/Shared
      - App/HeldDearSchemaTest
    settings:
      base:
        PRODUCT_NAME: HeldDearSchemaTest
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.helddear.schematest
        CODE_SIGN_ENTITLEMENTS: Config/HeldDearSchemaTest.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/SchemaTest-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Schema Test
        INFOPLIST_KEY_NSContactsUsageDescription: "Schema Test never reads contacts. This text is here because the shared app code can."
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Schema Test never writes to your calendar. This text is here because the shared app code can."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Schema Test never listens. This text is here because the shared app code can."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Schema Test never reads your photos. This text is here because the shared app code can."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Schema Test never listens. This text is here because the shared app code can."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SCHEMA_TEST"
        HELDDEAR_CLOUDKIT_CONTAINER: iCloud.com.grahamdeno.helddear.schematest
        HELDDEAR_APP_GROUP: group.com.grahamdeno.helddear.schematest
      # Same rule as the real app: Debug builds use Development, Release builds (TestFlight) use Production.
      configs:
        Debug:
          HELDDEAR_CLOUDKIT_ENVIRONMENT: Development
        Release:
          HELDDEAR_CLOUDKIT_ENVIRONMENT: Production
  HeldDearShare:
    type: app-extension
    platform: iOS
    sources:
      - App/HeldDearShare
      - App/Shared
      - path: App/HeldDear/Resources/Fonts/Fraunces72pt-Light.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/Fraunces72pt-LightItalic.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/Fraunces9pt-Regular.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/Fraunces9pt-Italic.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.helddear.share
        CODE_SIGN_ENTITLEMENTS: Config/HeldDearShare.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Share-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Held Dear
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  HeldDearWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/HeldDearWidgets
      - App/Shared
      - path: App/HeldDear/Resources/Fonts/Fraunces72pt-Light.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/Fraunces72pt-LightItalic.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/Fraunces9pt-Regular.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/Fraunces9pt-Italic.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.helddear.widgets
        CODE_SIGN_ENTITLEMENTS: Config/HeldDearWidgets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Widgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Held Dear
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  HeldDearTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/HeldDearTests
    dependencies:
      - target: HeldDear
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.helddear.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HeldDear.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HeldDear"
        BUNDLE_LOADER: "$(TEST_HOST)"
  HeldDearUITests:
    # The accessibility walk (Story E): UI tests in demo mode, run by hand from ux-walk.yml. Never in the app.
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/HeldDearUITests
    dependencies:
      - target: HeldDear
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.helddear.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HeldDear
schemes:
  HeldDearWalk:
    build:
      targets:
        HeldDear: all
    test:
      targets:
        - HeldDearUITests
  HeldDear:
    build:
      targets:
        HeldDear: all
    test:
      targets:
        - HeldDearTests
  HeldDearSchemaTest:
    build:
      targets:
        HeldDearSchemaTest: all
