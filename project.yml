# Held Dear. `xcodegen generate` makes HeldDear.xcodeproj (not checked in).
name: HeldDear
options:
  bundleIdPrefix: com.grahamdeno
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7MHDTK68M2
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HeldDear:
    type: application
    platform: iOS
    sources:
      - App/HeldDear
      - App/Shared
    dependencies:
      - target: HeldDearShare
      - target: HeldDearWidgets
    settings:
      base:
        PRODUCT_NAME: HeldDear
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.helddear
        CODE_SIGN_ENTITLEMENTS: Config/HeldDear.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Held Dear
        INFOPLIST_KEY_NSContactsUsageDescription: "Held Dear looks for birthdays, phone numbers and addresses already in your contacts. Nothing leaves your iPhone."
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Held Dear adds a dinner date you choose to your calendar. It never reads your calendar."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Held Dear turns what you say into text on this iPhone, so you can add a birthday or a wish by voice."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Held Dear listens only after you tap the microphone button, to add a birthday or a wish by voice."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  HeldDearShare:
    type: app-extension
    platform: iOS
    sources:
      - App/HeldDearShare
      - App/Shared
      - path: App/HeldDear/Resources/Fonts/InstrumentSans-Regular.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/InstrumentSans-Medium.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/InstrumentSans-SemiBold.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/InstrumentSans-Italic.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/InstrumentSerif-Regular.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/InstrumentSerif-Italic.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.helddear.share
        CODE_SIGN_ENTITLEMENTS: Config/HeldDearShare.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Share-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Held Dear
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  HeldDearWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/HeldDearWidgets
      - App/Shared
      - path: App/HeldDear/Resources/Fonts/InstrumentSans-Regular.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/InstrumentSans-Medium.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/InstrumentSans-SemiBold.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/InstrumentSans-Italic.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/InstrumentSerif-Regular.ttf
        buildPhase: resources
      - path: App/HeldDear/Resources/Fonts/InstrumentSerif-Italic.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.helddear.widgets
        CODE_SIGN_ENTITLEMENTS: Config/HeldDearWidgets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Widgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Held Dear
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  HeldDearTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/HeldDearTests
    dependencies:
      - target: HeldDear
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.helddear.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HeldDear.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HeldDear"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  HeldDear:
    build:
      targets:
        HeldDear: all
    test:
      targets:
        - HeldDearTests
