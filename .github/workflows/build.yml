name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Mail server tests
        run: cd server && node --test

      - name: Privacy guard
        # Held Dear keeps data on the phone: no network, contacts read only, calendar write only.
        run: |
          python3 -I scripts/privacy_guard.py selftest
          python3 -I scripts/privacy_guard.py check

      - name: CloudKit environment guard
        # The schema workflow may name the Development environment only. The self-test proves a test line that names
        # any other environment makes the guard fail.
        run: |
          python3 -I scripts/cloudkit_env_guard.py selftest
          python3 -I scripts/cloudkit_env_guard.py check .github/workflows/cloudkit-schema.yml .github/workflows/cloudkit-schema-test.yml
          python3 -I scripts/cloudkit_env_guard.py container .github/workflows/cloudkit-schema-test.yml .github/workflows/schematest-testflight.yml

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo '::error::Xcode 26 is unavailable'; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          if [ -z "$UDID" ]; then echo '::error::No available iPhone simulator'; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          mkdir -p ci-artifacts
          set -o pipefail
          xcodebuild test \
            -project HeldDear.xcodeproj \
            -scheme HeldDear \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath ci-artifacts/HeldDear.xcresult \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            > ci-artifacts/build.log 2>&1 \
            || { grep -E "error:|failed|crash|Early unexpected exit|encountered an error|Terminating app|Fatal error" ci-artifacts/build.log | grep -v "CoreData: error" | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done; tail -40 ci-artifacts/build.log; exit 1; }
          grep -E "Test Suite 'All tests'|Executed|\*\* TEST" ci-artifacts/build.log | tail -5
          # Per-suite counts for the reviewed order code, so a review can see them by name (Fable re-check, Nov 25, 2026).
          for s in SlowOrderTests MailedOrdersTests CardReasonTests; do
            echo "$s: $(grep -c "Test Case '-\[HeldDearTests\.$s .*' passed" ci-artifacts/build.log) passed, $(grep -c "Test Case '-\[HeldDearTests\.$s .*' failed" ci-artifacts/build.log) failed"
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helddear-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          retention-days: 7
          if-no-files-found: warn

  # CloudKit schema probe, P1 attempt (fix/schema-review-p2-p5, Fable's review). Runs the app itself in the simulator, signed locally with only the
  # iCloud entitlements, asks Core Data for a dry run that prints the schema, and compares what Apple printed with
  # cloudkit/schema.ckdb. Expected result today: the iCloud-account failure. It fails softly and blocks nothing. It uploads nothing to iCloud (dry run), builds and tests only.
  schema-probe:
    if: startsWith(github.head_ref, 'fix/schema') || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo '::error::Xcode 26 is unavailable'; exit 1; fi
          sudo xcode-select -s "$XC"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build the app for the simulator, signed locally with the iCloud entitlements only
        run: |
          mkdir -p probe
          set -o pipefail
          xcodebuild build \
            -project HeldDear.xcodeproj -scheme HeldDear -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/dd \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS=Config/HeldDearProbe.entitlements \
            > probe/build.log 2>&1 \
            || { grep -E "error:" probe/build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done; tail -40 probe/build.log; exit 1; }

      - name: Run the app with -printCloudKitSchema and collect what Apple printed
        run: |
          UDID=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -1)
          xcrun simctl boot "$UDID"
          APP=$(find build/dd/Build/Products -maxdepth 3 -name HeldDear.app | head -1)
          xcrun simctl install "$UDID" "$APP"
          codesign -d --entitlements - "$APP" > probe/entitlements.txt 2>&1 || true
          xcrun simctl launch --terminate-running-process --stdout="$PWD/probe/stdout.txt" --stderr="$PWD/probe/stderr.txt" \
            "$UDID" com.grahamdeno.helddear -printCloudKitSchema
          DATA=$(xcrun simctl get_app_container "$UDID" com.grahamdeno.helddear data)
          for i in $(seq 1 60); do [ -f "$DATA/tmp/schema-probe-done.txt" ] && break; sleep 3; done
          cp "$DATA/tmp/schema-probe-done.txt" probe/done.txt 2>/dev/null || echo "no done file after 3 minutes" > probe/done.txt
          cp "$DATA/tmp/generated.ckdb" probe/generated.ckdb 2>/dev/null || echo "no generated file" > probe/generated.ckdb
          xcrun simctl spawn "$UDID" log show --style compact --info --debug --last 20m \
            --predicate 'subsystem BEGINSWITH "com.apple.coredata"' > probe/log-coredata.txt 2>&1 || true
          xcrun simctl spawn "$UDID" log show --style compact --info --debug --last 20m \
            --predicate 'process == "HeldDear"' > probe/log-app.txt 2>&1 || true
          echo "::group::done file"; cat probe/done.txt; echo; echo "::endgroup::"
          echo "::group::entitlements the app was signed with"; cat probe/entitlements.txt; echo "::endgroup::"
          echo "::group::stdout and stderr of the app"; cat probe/stdout.txt probe/stderr.txt 2>/dev/null | head -400; echo "::endgroup::"
          echo "::group::schema lines Apple printed (core data log)"
          grep -hE "DEFINE SCHEMA|RECORD TYPE|CD_|GRANT|QUERYABLE|ASSET|REFERENCE|ckAsset" probe/log-coredata.txt probe/log-app.txt probe/stdout.txt probe/stderr.txt 2>/dev/null | head -600
          echo "::endgroup::"
          echo "::group::the generator's file (from the model)"; cat probe/generated.ckdb; echo "::endgroup::"
          wc -l probe/*.txt probe/*.ckdb

      - name: Compare what Apple printed with cloudkit/schema.ckdb (P1)
        run: |
          if [ "$(cat probe/done.txt)" != "done" ]; then
            echo "::warning::P1 attempt: the dry run did not complete: $(cat probe/done.txt)"
            exit 1
          fi
          python3 -I - <<'PY'
          import re
          def keep(text):
              lines = [re.sub(r"\s+", " ", l.strip()).rstrip(",") for l in text.splitlines()]
              return {l for l in lines if "CD_" in l or "RECORD TYPE" in l or "GRANT" in l}
          printed = keep(open("probe/log-coredata.txt").read() + "\n" + open("probe/stdout.txt").read())
          wanted = keep(open("cloudkit/schema.ckdb").read())
          missing = sorted(wanted - printed)
          extra = sorted(printed - wanted)
          print("in the file, not printed by Apple:", len(missing))
          for l in missing[:200]: print("  -", l)
          print("printed by Apple, not in the file:", len(extra))
          for l in extra[:200]: print("  +", l)
          raise SystemExit(1 if missing or extra else 0)
          PY

      - name: Upload the probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helddear-schema-probe-${{ github.run_id }}
          path: probe/
          retention-days: 14
          if-no-files-found: warn

  # Both apps build (Nov 23, 2026): the real HeldDear target and the Schema Test target (no extensions, own container and
  # group). Prints each app's entitlements as built, so a reviewer can read them without downloading anything. Builds
  # only; uploads and deploys nothing.
  schema-test-build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo '::error::Xcode 26 is unavailable'; exit 1; fi
          sudo xcode-select -s "$XC"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build both targets, Debug and Release, for the simulator
        run: |
          set -o pipefail
          mkdir -p build-logs
          for SCHEME in HeldDear HeldDearSchemaTest; do
            for CONFIG in Debug Release; do
              xcodebuild build -project HeldDear.xcodeproj -scheme "$SCHEME" -configuration "$CONFIG" \
                -destination "generic/platform=iOS Simulator" -derivedDataPath "build/dd-$SCHEME-$CONFIG" \
                CODE_SIGNING_ALLOWED=NO > "build-logs/$SCHEME-$CONFIG.log" 2>&1 \
                || { grep -E "error:" "build-logs/$SCHEME-$CONFIG.log" | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done; tail -40 "build-logs/$SCHEME-$CONFIG.log"; exit 1; }
              echo "$SCHEME $CONFIG: built"
            done
          done

      - name: Print each app's entitlements and identifiers as built
        run: |
          for SCHEME in HeldDear HeldDearSchemaTest; do
            for CONFIG in Debug Release; do
              echo "::group::$SCHEME $CONFIG"
              APP=$(find "build/dd-$SCHEME-$CONFIG/Build/Products" -maxdepth 3 -name "$SCHEME.app" | head -1)
              /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
              /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
              /usr/libexec/PlistBuddy -c 'Print :HeldDearCloudKitEnvironment' "$APP/Info.plist" || true
              /usr/libexec/PlistBuddy -c 'Print :HeldDearCloudKitContainer' "$APP/Info.plist" 2>/dev/null || echo "(no HeldDearCloudKitContainer key: the app uses its own container)"
              /usr/libexec/PlistBuddy -c 'Print :HeldDearAppGroup' "$APP/Info.plist" 2>/dev/null || echo "(no HeldDearAppGroup key: the app uses its own group)"
              echo "extensions: $(ls "$APP/PlugIns" 2>/dev/null | tr '\n' ' ')"
              XCENT=$(find "build/dd-$SCHEME-$CONFIG/Build/Intermediates.noindex" -name "$SCHEME.app.xcent" | head -1)
              if [ -n "$XCENT" ]; then echo "--- entitlements as built ($XCENT)"; cat "$XCENT"; else echo "::warning::no .xcent file found"; fi
              echo "::endgroup::"
            done
          done

      - name: Entitlements as built, Release (ad hoc signed for the simulator, not a store signing)
        continue-on-error: true
        run: |
          for SCHEME in HeldDear HeldDearSchemaTest; do
            echo "::group::$SCHEME Release entitlements"
            xcodebuild build -project HeldDear.xcodeproj -scheme "$SCHEME" -configuration Release \
              -destination "generic/platform=iOS Simulator" -derivedDataPath "build/signed-$SCHEME" \
              CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="" > "build-logs/signed-$SCHEME.log" 2>&1 \
              || { echo "(signed build failed; last lines:)"; tail -15 "build-logs/signed-$SCHEME.log"; }
            APP=$(find "build/signed-$SCHEME/Build/Products" -maxdepth 3 -name "$SCHEME.app" | head -1)
            [ -n "$APP" ] && codesign -d --entitlements - "$APP" 2>&1 | sed 's/^/  /' || echo "(no app to read)"
            echo "--- entitlements file with this target's build settings filled in"
            xcodebuild -showBuildSettings -project HeldDear.xcodeproj -scheme "$SCHEME" -configuration Release 2>/dev/null \
              | grep -E "^\s+(PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_ENTITLEMENTS|HELDDEAR_[A-Z_]+) =" | sed 's/^ */  /'
            echo "::endgroup::"
          done

      - name: The Schema Test app has its own identifiers and no extensions
        run: |
          APP=$(find build/dd-HeldDearSchemaTest-Release/Build/Products -maxdepth 3 -name HeldDearSchemaTest.app | head -1)
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.grahamdeno.helddear.schematest" ] || { echo '::error::wrong bundle ID'; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :HeldDearCloudKitContainer' "$APP/Info.plist")" = "iCloud.com.grahamdeno.helddear.schematest" ] || { echo '::error::wrong container'; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :HeldDearAppGroup' "$APP/Info.plist")" = "group.com.grahamdeno.helddear.schematest" ] || { echo '::error::wrong group'; exit 1; }
          [ ! -d "$APP/PlugIns" ] || { echo '::error::the test app must have no extensions'; exit 1; }
          REAL=$(find build/dd-HeldDear-Release/Build/Products -maxdepth 3 -name HeldDear.app | head -1)
          if /usr/libexec/PlistBuddy -c 'Print :HeldDearCloudKitContainer' "$REAL/Info.plist" 2>/dev/null; then echo '::error::the real app must not carry the test container key'; exit 1; fi
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$REAL/Info.plist")" = "com.grahamdeno.helddear" ] || { echo '::error::real bundle ID changed'; exit 1; }
          echo "Both apps are as intended."
